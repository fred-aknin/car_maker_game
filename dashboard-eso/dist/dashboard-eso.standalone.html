<html lang="fr">
<head>
<meta charset="utf-8">

</head>
<body>
<title>Dashboard ESO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Dashboard ESO — feuille de style.
   Concept : un poste de pilotage sobre, colonne de navigation à gauche,
   panneaux de données à droite, fiches en tiroir latéral.
   Tokens : encre bleu-nuit, accent « lagon » (couleur de l'école),
   or doux pour les montants, sémantique vert / ambre / rouge séparée de l'accent. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #e9edf3;
  --line: #d6dce6;
  --fg: #152033;
  --fg-2: #4c5a70;
  --fg-3: #7d8a9e;
  --accent: #0e7c86;
  --accent-ink: #ffffff;
  --accent-soft: #d8eff1;
  --gold: #a9721a;
  --gold-soft: #f6ecd7;
  --good: #1f8a4c;
  --good-soft: #dcf2e4;
  --warn: #b7791f;
  --warn-soft: #fbeed3;
  --crit: #c0392b;
  --crit-soft: #f9dcd8;
  --info-soft: #dde8fb;
  --shadow: 0 1px 2px rgba(21, 32, 51, 0.06), 0 8px 24px rgba(21, 32, 51, 0.08);
  --radius: 10px;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  --nav-w: 224px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1520; --surface: #171f2d; --surface-2: #1f2937; --line: #2c3748;
    --fg: #e8edf5; --fg-2: #aab6c8; --fg-3: #7b889c;
    --accent: #3fb5bf; --accent-ink: #06161a; --accent-soft: #11363b;
    --gold: #e0b35a; --gold-soft: #3a2e14;
    --good: #4cc27a; --good-soft: #143224; --warn: #e2a63c; --warn-soft: #3b2c11;
    --crit: #ef6a5c; --crit-soft: #3f1c18; --info-soft: #1d2a45;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1520; --surface: #171f2d; --surface-2: #1f2937; --line: #2c3748;
  --fg: #e8edf5; --fg-2: #aab6c8; --fg-3: #7b889c;
  --accent: #3fb5bf; --accent-ink: #06161a; --accent-soft: #11363b;
  --gold: #e0b35a; --gold-soft: #3a2e14;
  --good: #4cc27a; --good-soft: #143224; --warn: #e2a63c; --warn-soft: #3b2c11;
  --crit: #ef6a5c; --crit-soft: #3f1c18; --info-soft: #1d2a45;
  --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; text-wrap: balance; font-weight: 600; }
h1 { font-size: 22px; letter-spacing: -0.01em; }
h2 { font-size: 17px; }
h3 { font-size: 14px; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-2); }
.faint { color: var(--fg-3); }
.small { font-size: 12px; }
.eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); font-weight: 600; }
.mono { font-family: var(--font-mono); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---- Structure ---- */
.app { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); min-height: 100%; }
.nav {
  background: var(--surface); border-right: 1px solid var(--line);
  padding: 20px 14px; display: flex; flex-direction: column; gap: 6px;
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.02em;
}
.brand-title { font-family: var(--font-display); font-weight: 700; font-size: 15px; line-height: 1.1; }
.brand-sub { font-size: 11px; color: var(--fg-3); }
.nav-btn {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 9px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--fg-2); font-weight: 500;
}
.nav-btn svg { width: 18px; height: 18px; flex: none; }
.nav-btn:hover { background: var(--surface-2); color: var(--fg); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-btn .badge { margin-left: auto; }
.nav-foot { margin-top: auto; padding: 8px; font-size: 11px; color: var(--fg-3); display: flex; flex-direction: column; gap: 6px; }

.main { min-width: 0; padding-block: 18px 40px; padding-inline: 24px; display: flex; flex-direction: column; gap: 18px; }
.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.topbar h1 { margin-right: auto; }
.topbar .sub { color: var(--fg-2); font-size: 13px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---- Contrôles ---- */
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-weight: 500; line-height: 1.2;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--fg-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn.danger { color: var(--crit); }
.btn.sm { padding: 4px 9px; font-size: 12px; border-radius: 6px; }
.btn svg { width: 15px; height: 15px; }
.select, .input, textarea.input {
  padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); min-width: 0;
}
.input { width: 100%; }
textarea.input { resize: vertical; min-height: 72px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 11px; color: var(--fg-2); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; color: var(--fg-2); font-weight: 600; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }

/* ---- Badges ---- */
.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px;
  font-size: 11.5px; font-weight: 600; background: var(--surface-2); color: var(--fg-2); white-space: nowrap;
}
.badge.good { background: var(--good-soft); color: var(--good); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.crit { background: var(--crit-soft); color: var(--crit); }
.badge.accent { background: var(--accent-soft); color: var(--accent); }
.badge.gold { background: var(--gold-soft); color: var(--gold); }
.badge.info { background: var(--info-soft); color: var(--fg); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-3); display: inline-block; }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.crit { background: var(--crit); } .dot.accent { background: var(--accent); }

/* ---- Bannières d'état ---- */
.banner {
  display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius);
  background: var(--info-soft); border: 1px solid var(--line);
}
.banner.warn { background: var(--warn-soft); }
.banner.crit { background: var(--crit-soft); }
.banner.good { background: var(--good-soft); }
.banner .grow { flex: 1; min-width: 0; }
.banner strong { display: block; }

/* ---- Cartes et grilles ---- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.card-head .hint { font-size: 12px; color: var(--fg-3); }
.grid-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { display: flex; flex-direction: column; gap: 4px; }
.kpi .label { font-size: 12px; color: var(--fg-2); font-weight: 600; }
.kpi .value { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .value.gold { color: var(--gold); }
.kpi .foot { font-size: 12px; color: var(--fg-3); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.kpi.alert { border-left: 3px solid var(--crit); }
.kpi.watch { border-left: 3px solid var(--warn); }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.grow { flex: 1 1 auto; min-width: 0; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list { display: flex; flex-direction: column; }
.list-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); min-width: 0; overflow: hidden; }
.list-item:first-child { border-top: 0; }
.list-item.clickable { cursor: pointer; }
.list-item.clickable:hover { background: var(--surface-2); margin-inline: -8px; padding-inline: 8px; border-radius: 6px; }
.avatar {
  width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none;
}
.empty { color: var(--fg-3); font-size: 13px; padding: 12px 0; text-align: center; }

/* ---- Tableaux ---- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 11.5px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-3); font-weight: 600; white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
th button { border: 0; background: none; padding: 0; color: inherit; font: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; }
th button[data-active="true"] { color: var(--accent); }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--surface-2); }
td.num, th.num { text-align: right; }

/* ---- Graphiques ---- */
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--font-mono); font-size: 10px; fill: var(--fg-3); }
.chart .axis { stroke: var(--line); }
.chart .bar { fill: var(--accent); }
.chart .bar.soft { fill: var(--accent-soft); }
.chart .bar.gold { fill: var(--gold); }
.chart .bar.prev { fill: var(--surface-2); }
.chart .label-strong { fill: var(--fg); font-weight: 600; }
.hbar { display: grid; grid-template-columns: minmax(90px, 160px) 1fr auto; gap: 8px; align-items: center; font-size: 12.5px; padding: 3px 0; }
.hbar .track { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.hbar .fill { height: 100%; background: var(--accent); border-radius: 5px; }
.hbar .fill.gold { background: var(--gold); }
.hbar .fill.crit { background: var(--crit); }
.hbar .fill.muted { background: var(--fg-3); }
.funnel { display: flex; flex-direction: column; gap: 4px; }
.funnel-row { display: grid; grid-template-columns: minmax(110px, 150px) 1fr auto; gap: 8px; align-items: center; font-size: 12.5px; }
.funnel-row .bar { height: 18px; border-radius: 4px; background: var(--accent); opacity: 0.9; min-width: 2px; }
.funnel-row.dead .bar { background: var(--fg-3); opacity: 0.6; }

/* ---- Kanban ---- */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: 250px; gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.kcol { background: var(--surface-2); border-radius: var(--radius); padding: 10px; min-height: 120px; display: flex; flex-direction: column; gap: 8px; }
.kcol.over { outline: 2px dashed var(--accent); }
.kcol-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.kcol-head h3 { font-size: 13px; }
.kcol-head .sum { font-size: 11px; color: var(--fg-3); white-space: nowrap; }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.kcard:hover { box-shadow: var(--shadow); }
.kcard[draggable="true"] { cursor: grab; }
.kcard .name { font-weight: 600; font-size: 13px; }
.kcard .meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 11.5px; color: var(--fg-3); }
.kcard.stale { border-left: 3px solid var(--warn); }
.kcard.won { border-left: 3px solid var(--good); }
.kcard.lost { border-left: 3px solid var(--crit); opacity: 0.8; }

/* ---- Planning ---- */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; min-height: 160px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.day.past { opacity: 0.75; }
.day-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; }
.day-head strong { font-family: var(--font-display); font-size: 14px; }
.ev { padding: 6px 8px; border-radius: 6px; font-size: 12px; cursor: pointer; border-left: 3px solid var(--fg-3); background: var(--surface-2); min-width: 0; }
.ev .t { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
.ev .n { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev.event { border-left-color: var(--accent); }
.ev.call { border-left-color: var(--gold); }
.ev.task { border-left-color: var(--warn); }
.ev.task.late { border-left-color: var(--crit); }
.ev.done { opacity: 0.55; text-decoration: line-through; }

/* ---- Tiroir ---- */
.drawer-backdrop { position: fixed; inset: 0; background: rgba(10, 16, 28, 0.45); z-index: 40; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 41;
  box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden;
  padding-top: env(safe-area-inset-top, 0px);
}
.drawer-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
.drawer-head h2 { font-size: 18px; }
.drawer-body { overflow: auto; padding: 16px 20px 32px; display: flex; flex-direction: column; gap: 16px; }
.props { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 16px; }
.prop { min-width: 0; }
.prop .k { font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
.prop .v { font-size: 13.5px; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.quote { border-left: 3px solid var(--line); padding: 6px 12px; color: var(--fg-2); font-size: 13px; white-space: pre-wrap; }
.panel { background: var(--surface-2); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.panel h3 { font-size: 13px; }
.ai { background: var(--accent-soft); border-radius: 8px; padding: 12px; font-size: 13px; white-space: pre-wrap; line-height: 1.5; }
.timeline { display: flex; flex-direction: column; gap: 6px; }
.tl { display: grid; grid-template-columns: 70px 1fr; gap: 8px; font-size: 12.5px; align-items: baseline; }
.tl .when { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }

/* ---- Toasts ---- */
.toasts { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 60; width: min(420px, calc(100% - 32px)); }
.toast { background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow); }
.toast.crit { background: var(--crit); color: #fff; }
.toast.good { background: var(--good); color: #fff; }

/* ---- Chargement ---- */
.skeleton { background: linear-gradient(90deg, var(--surface-2) 25%, var(--line) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: sk 1.4s infinite; border-radius: 6px; height: 14px; }
@keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .skeleton, .spin { animation: none; } }

/* ---- Mobile ---- */
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .nav {
    position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; flex-direction: row; gap: 0;
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); border-right: 0; border-top: 1px solid var(--line); z-index: 30;
  }
  .brand, .nav-foot { display: none; }
  .nav-btn { flex-direction: column; gap: 3px; font-size: 10.5px; padding: 6px 2px; justify-content: center; flex: 1; }
  .nav-btn { position: relative; }
  .nav-btn .badge { margin: 0; position: absolute; top: 2px; right: 10%; padding: 0 5px; font-size: 10px; }
  .main { padding-inline: 16px; padding-bottom: 90px; }
  .week { grid-template-columns: 1fr; }
  .day { min-height: 0; }
  .kanban { grid-auto-columns: 82vw; }
  .drawer { width: 100%; }
}

</style>
<div class="app">
  <nav class="nav" id="nav" aria-label="Navigation principale"></nav>
  <main class="main" id="main"></main>
</div>
<div id="drawer-host"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
/*
 * Dashboard ESO — logique métier pure (sans DOM).
 *
 * Ce module est partagé entre la page publiée (inliné par build.mjs) et les
 * tests Node (`node --test`). Il ne doit dépendre ni de `window` ni de `document`.
 *
 * Tout ce qui touche Zoho CRM est exprimé avec les noms d'API réels de
 * l'organisation ESO (voir ../docs/zoho-schema.md).
 */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.ESO = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  const MS_DAY = 86400000;

  /* ------------------------------------------------------------------ */
  /* 1. Référentiels Zoho CRM (valeurs de listes réelles)               */
  /* ------------------------------------------------------------------ */

  const SERVER = "Zoho CRM";

  /** Champs demandés à getRecords, par module. */
  const FIELDS = {
    Leads: [
      "Full_Name", "First_Name", "Last_Name", "Email", "Phone", "Phone_2",
      "Lead_Status", "Lead_Source", "Etapes_du_prospect", "R_le", "Owner",
      "Created_Time", "Modified_Time", "Last_Activity_Time", "Score", "City",
      "Ann_e_d_obtention_du_dipl_me", "Probabilit_de_conversion_222",
      "Type_du_Prospect", "Est_en_train_de_pourrir", "Campagne_UTM",
      "Converted__s", "Message_Nous_Contacter", "Motivations_Dossier",
      "Projet_Dossier", "Formation_Dossier", "Message_Candidature",
    ],
    Deals: [
      "Deal_Name", "Stage", "Pipeline", "Amount", "Acompte_ESO", "Closing_Date",
      "Contact_Name", "Owner", "Modified_Time", "Created_Time",
      "Last_Activity_Time", "Promotion", "R_sultat_appel_d_valuation_initiale",
      "Reason_For_Loss__s", "Type", "Probability", "Date_de_l_acompte",
      "Montant_des_paiements_re_us", "Montant_re_u_startbox", "Lead_Source",
      "Appr_ciation_ESO", "Type_de_paiement", "Date_d_envoi_du_lien",
    ],
    Tasks: [
      "Subject", "Due_Date", "Status", "Priority", "Who_Id", "What_Id", "Owner",
      "Description", "Created_Time", "Modified_Time", "Closed_Time",
    ],
    Calls: [
      "Subject", "Call_Type", "Call_Purpose", "Call_Result", "Call_Start_Time",
      "Call_Duration", "Call_Duration_in_seconds", "Who_Id", "What_Id", "Owner",
      "Outgoing_Call_Status", "Description", "Created_Time", "Modified_Time",
    ],
    Events: [
      "Event_Title", "Start_DateTime", "End_DateTime", "Who_Id", "What_Id",
      "Owner", "Venue", "Meeting_Venue__s", "R_sultat_de_la_r_union",
      "All_day", "Description", "Created_Time", "Modified_Time",
    ],
  };

  /** Nombre maximal de pages (200 enregistrements chacune) par module. */
  const PAGE_BUDGET = { Leads: 6, Deals: 5, Tasks: 3, Calls: 3, Events: 3 };

  /** Statuts de prospect, dans l'ordre du parcours de qualification. */
  const LEAD_STATUS_ORDER = [
    "Nouveau", "Non contacté", "Contacté", "Pré-qualifié", "Qualifié",
    "A convertir", "Contact à l'avenir",
  ];
  const LEAD_STATUS_DEAD = ["Non qualifié", "Lead perdu", "Spam"];
  const LEAD_STATUS_ALL = LEAD_STATUS_ORDER.concat(LEAD_STATUS_DEAD);
  const LEAD_TODO = ["Nouveau", "Non contacté"];

  /** Étapes du prospect (champ Etapes_du_prospect). */
  const LEAD_STEPS = [
    "Coup de fil Jérôme", "Coup fil sans réponse", "Rdv programmé Dr JJA",
    "Rdv Dr JJA réalisé", "Mail d'admission adressé", "Acompte payé",
  ];

  /** Étapes d'affaire, dans l'ordre du pipeline Recrutement. */
  const DEAL_STAGES = [
    "Évaluation initiale", "Qualification", "Prise de rendez-vous - Admissions",
    "RDV fixé", "Entretiens", "Value Proposition", "Identify Decision Makers",
    "Accord non contractuel", "En attente acompte", "Acompte partiel",
    "Paiement acompte reçu", "Acompte payé", "Engagement contractuel",
    "Gagné", "Closed Won", "Perdu", "Rejeté", "Closed-Lost to Competition",
  ];
  const DEAL_WON = ["Gagné", "Closed Won"];
  const DEAL_LOST = ["Perdu", "Rejeté", "Closed-Lost to Competition"];
  const DEAL_DEPOSIT_PENDING = ["En attente acompte", "Acompte partiel"];
  /** Étapes affichées en priorité dans le kanban (les autres n'apparaissent que si non vides). */
  const DEAL_STAGES_MAIN = [
    "Évaluation initiale", "Prise de rendez-vous - Admissions", "RDV fixé",
    "Entretiens", "Accord non contractuel", "En attente acompte",
    "Acompte partiel", "Acompte payé", "Engagement contractuel", "Gagné", "Perdu",
  ];
  const PIPELINES = ["Recrutement", "Startbox", "Standard (Standard)"];
  const LOSS_REASONS = [
    "A choisi la concurrence", "Problème financement", "Renonce au projet",
    "Internat", "Désistement après acompte", "Candidat non retenu",
    "Manque de réponse", "Autre",
  ];
  const EVAL_RESULTS = [
    "Candidat retenu", "Candidat non retenu", "Le candidat ne donne pas suite",
    "Appel infructueux",
  ];

  const CALL_RESULTS = [
    "Interested", "Not interested", "No response/Busy", "Requested more info",
    "Requested call back", "Invalid number", "Candidat retenu",
  ];
  const CALL_RESULT_FR = {
    "Interested": "Intéressé",
    "Not interested": "Pas intéressé",
    "No response/Busy": "Sans réponse / occupé",
    "Requested more info": "Demande d'infos",
    "Requested call back": "À rappeler",
    "Invalid number": "Numéro invalide",
    "Candidat retenu": "Candidat retenu",
  };
  const CALL_TYPE_FR = { Outbound: "Sortant", Inbound: "Entrant", Missed: "Manqué" };
  const TASK_STATUS_FR = {
    "Not Started": "À faire", "Deferred": "Reportée", "In Progress": "En cours",
    "Completed": "Terminée", "Waiting for input": "En attente",
  };
  const TASK_PRIORITIES = ["Highest", "High", "Normal", "Low", "Lowest"];
  const TASK_PRIORITY_FR = {
    Highest: "Très haute", High: "Haute", Normal: "Normale", Low: "Basse", Lowest: "Très basse",
  };
  const MEETING_RESULTS = ["Suite positive", "Suite négative", "Non aboutie"];

  /* ------------------------------------------------------------------ */
  /* 2. Normalisation des enregistrements Zoho                           */
  /* ------------------------------------------------------------------ */

  function ts(v) {
    if (!v) return null;
    const t = Date.parse(v);
    return Number.isNaN(t) ? null : t;
  }
  function dateOnly(v) {
    // "2026-10-07" -> midi local, pour éviter les décalages de fuseau.
    if (!v) return null;
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3], 12).getTime();
    return ts(v);
  }
  function ref(v) {
    if (!v || typeof v !== "object") return null;
    return { id: v.id || null, name: v.name || v.email || "", email: v.email || null };
  }
  function num(v) {
    if (v === null || v === undefined || v === "") return null;
    const n = typeof v === "number" ? v : Number(v);
    return Number.isNaN(n) ? null : n;
  }
  function yesNo(v) { return v === "Oui" ? true : v === "Non" ? false : null; }

  function normalizeLead(r) {
    const name = r.Full_Name || [r.First_Name, r.Last_Name].filter(Boolean).join(" ") || "(sans nom)";
    return {
      id: String(r.id),
      module: "Leads",
      name,
      firstName: r.First_Name || null,
      lastName: r.Last_Name || null,
      email: r.Email || null,
      phone: r.Phone || r.Phone_2 || null,
      status: r.Lead_Status || "—",
      source: r.Lead_Source || "Inconnue",
      step: r.Etapes_du_prospect || null,
      role: r.R_le || null,
      owner: ref(r.Owner),
      created: ts(r.Created_Time),
      modified: ts(r.Modified_Time),
      lastActivity: ts(r.Last_Activity_Time),
      score: num(r.Score) ?? 0,
      city: r.City || null,
      diplomaYear: num(r.Ann_e_d_obtention_du_dipl_me),
      probability: num(r.Probabilit_de_conversion_222),
      type: r.Type_du_Prospect || null,
      rotting: yesNo(r.Est_en_train_de_pourrir),
      campaign: r.Campagne_UTM || null,
      converted: r.Converted__s === true,
      message: r.Message_Nous_Contacter || r.Message_Candidature || null,
      motivations: r.Motivations_Dossier || null,
      project: r.Projet_Dossier || null,
      training: r.Formation_Dossier || null,
    };
  }

  function normalizeDeal(r) {
    return {
      id: String(r.id),
      module: "Deals",
      name: r.Deal_Name || "(sans nom)",
      stage: r.Stage || "—",
      pipeline: r.Pipeline || "Recrutement",
      amount: num(r.Amount),
      deposit: num(r.Acompte_ESO),
      closing: dateOnly(r.Closing_Date),
      contact: ref(r.Contact_Name),
      owner: ref(r.Owner),
      created: ts(r.Created_Time),
      modified: ts(r.Modified_Time),
      lastActivity: ts(r.Last_Activity_Time),
      promotion: ref(r.Promotion),
      evalResult: r.R_sultat_appel_d_valuation_initiale || null,
      lossReason: r.Reason_For_Loss__s || null,
      type: r.Type || null,
      probability: num(r.Probability),
      depositDate: dateOnly(r.Date_de_l_acompte),
      received: num(r.Montant_des_paiements_re_us) ?? 0,
      receivedStartbox: num(r.Montant_re_u_startbox) ?? 0,
      source: r.Lead_Source || null,
      appreciation: r.Appr_ciation_ESO || null,
      paymentType: r.Type_de_paiement || null,
      linkSent: dateOnly(r.Date_d_envoi_du_lien),
    };
  }

  function normalizeTask(r) {
    return {
      id: String(r.id),
      module: "Tasks",
      subject: r.Subject || "(sans objet)",
      due: dateOnly(r.Due_Date),
      status: r.Status || "Not Started",
      priority: r.Priority || "Normal",
      who: ref(r.Who_Id),
      what: ref(r.What_Id),
      relatedModule: r.$se_module || null,
      owner: ref(r.Owner),
      description: r.Description || null,
      created: ts(r.Created_Time),
      modified: ts(r.Modified_Time),
      closed: ts(r.Closed_Time),
    };
  }

  function normalizeCall(r) {
    return {
      id: String(r.id),
      module: "Calls",
      subject: r.Subject || "(appel)",
      type: r.Call_Type || "Outbound",
      purpose: r.Call_Purpose || null,
      result: r.Call_Result || null,
      start: ts(r.Call_Start_Time),
      duration: r.Call_Duration || null,
      seconds: num(r.Call_Duration_in_seconds) ?? 0,
      who: ref(r.Who_Id),
      what: ref(r.What_Id),
      relatedModule: r.$se_module || null,
      owner: ref(r.Owner),
      status: r.Outgoing_Call_Status || null,
      description: r.Description || null,
      created: ts(r.Created_Time),
      modified: ts(r.Modified_Time),
    };
  }

  function normalizeEvent(r) {
    return {
      id: String(r.id),
      module: "Events",
      title: r.Event_Title || "(réunion)",
      start: ts(r.Start_DateTime),
      end: ts(r.End_DateTime),
      allDay: r.All_day === true,
      who: ref(r.Who_Id),
      what: ref(r.What_Id),
      relatedModule: r.$se_module || null,
      owner: ref(r.Owner),
      venue: r.Venue || null,
      venueType: r.Meeting_Venue__s || null,
      result: r.R_sultat_de_la_r_union || null,
      description: r.Description || null,
      created: ts(r.Created_Time),
      modified: ts(r.Modified_Time),
    };
  }

  const NORMALIZERS = {
    Leads: normalizeLead, Deals: normalizeDeal, Tasks: normalizeTask,
    Calls: normalizeCall, Events: normalizeEvent,
  };

  /** Extrait la liste `data` d'une réponse getRecords / searchRecords. */
  function unwrapRecords(payload) {
    if (!payload) return { records: [], more: false };
    let p = payload;
    if (typeof p === "string") { try { p = JSON.parse(p); } catch (e) { return { records: [], more: false }; } }
    // Formes rencontrées : {status, data:{data:[...], info:{...}}} ou {data:[...], info:{...}}
    const inner = p && p.data && !Array.isArray(p.data) && p.data.data ? p.data : p;
    const records = Array.isArray(inner && inner.data) ? inner.data : [];
    const info = (inner && inner.info) || {};
    return { records, more: info.more_records === true, nextToken: info.next_page_token || null };
  }

  /** Arguments getRecords pour un module et une page. */
  function recordsArgs(module, page, extra) {
    const q = {
      fields: FIELDS[module].join(","),
      per_page: 200,
      page,
      sort_by: "Modified_Time",
      sort_order: "desc",
    };
    if (module === "Leads") q.converted = "false";
    return { path_variables: { module }, query_params: Object.assign(q, extra || {}) };
  }

  /* ------------------------------------------------------------------ */
  /* 3. Indicateurs et agrégations                                        */
  /* ------------------------------------------------------------------ */

  function isWon(d) { return DEAL_WON.includes(d.stage); }
  function isLost(d) { return DEAL_LOST.includes(d.stage); }
  function isOpenDeal(d) { return !isWon(d) && !isLost(d); }
  function isDeadLead(l) { return LEAD_STATUS_DEAD.includes(l.status) || l.converted; }
  function isTodoLead(l) { return LEAD_TODO.includes(l.status) && !l.converted; }
  function isQualifiedLead(l) { return ["Pré-qualifié", "Qualifié", "A convertir"].includes(l.status); }
  function isOpenTask(t) { return t.status !== "Completed"; }

  function startOfDay(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function endOfDay(t) { return startOfDay(t) + MS_DAY - 1; }
  function startOfWeek(t) {
    const d = new Date(startOfDay(t));
    const dow = (d.getDay() + 6) % 7; // lundi = 0
    return d.getTime() - dow * MS_DAY;
  }

  function byOwner(records, ownerId) {
    if (!ownerId || ownerId === "all") return records;
    return records.filter((r) => r.owner && r.owner.id === ownerId);
  }

  function countBy(arr, keyFn) {
    const m = new Map();
    for (const x of arr) {
      const k = keyFn(x);
      m.set(k, (m.get(k) || 0) + 1);
    }
    return m;
  }
  function sortedCounts(map, limit) {
    const out = [...map.entries()].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0])));
    return limit ? out.slice(0, limit) : out;
  }

  function pct(a, b) { return b > 0 ? Math.round((a / b) * 100) : 0; }
  function delta(cur, prev) {
    if (prev === 0) return cur === 0 ? 0 : null; // null = « nouveau » (pas de base)
    return Math.round(((cur - prev) / prev) * 100);
  }

  /**
   * Indicateurs du cockpit.
   * @param data {leads, deals, tasks, calls, events} normalisés
   * @param opts {now, days, owner}
   */
  function computeKpis(data, opts) {
    const now = opts.now;
    const days = opts.days || 30;
    const owner = opts.owner || "all";
    const from = now - days * MS_DAY;
    const prevFrom = from - days * MS_DAY;

    const leads = byOwner(data.leads, owner);
    const deals = byOwner(data.deals, owner);
    const tasks = byOwner(data.tasks, owner);
    const calls = byOwner(data.calls, owner);
    const events = byOwner(data.events, owner);

    const inPeriod = (t) => t !== null && t >= from && t <= now;
    const inPrev = (t) => t !== null && t >= prevFrom && t < from;

    const newLeads = leads.filter((l) => inPeriod(l.created));
    const newLeadsPrev = leads.filter((l) => inPrev(l.created));
    const todo = leads.filter(isTodoLead);
    const oldestTodo = todo.reduce((acc, l) => (l.created && (acc === null || l.created < acc) ? l.created : acc), null);
    const qualified = newLeads.filter(isQualifiedLead);
    const qualifiedPrev = newLeadsPrev.filter(isQualifiedLead);

    const recruit = deals.filter((d) => d.pipeline === "Recrutement");
    const open = recruit.filter(isOpenDeal);
    const weighted = open.reduce((s, d) => s + (d.amount || 0) * ((d.probability ?? 0) / 100), 0);
    const openAmount = open.reduce((s, d) => s + (d.amount || 0), 0);
    const depositPending = open.filter((d) => DEAL_DEPOSIT_PENDING.includes(d.stage));
    const won = recruit.filter((d) => isWon(d) && inPeriod(d.modified));
    const wonPrev = recruit.filter((d) => isWon(d) && inPrev(d.modified));
    const lost = recruit.filter((d) => isLost(d) && inPeriod(d.modified));
    const closedTotal = won.length + lost.length;

    const today0 = startOfDay(now);
    const overdueTasks = tasks.filter((t) => isOpenTask(t) && t.due !== null && t.due < today0);
    const todayTasks = tasks.filter((t) => isOpenTask(t) && t.due !== null && t.due >= today0 && t.due <= endOfDay(now));
    const upcomingEvents = events.filter((e) => e.start !== null && e.start >= now && e.start <= now + 7 * MS_DAY);
    const done = calls.filter((c) => c.status !== "Scheduled");
    const callsPeriod = done.filter((c) => inPeriod(c.start));
    const callsPrev = done.filter((c) => inPrev(c.start));
    const talkSeconds = callsPeriod.reduce((s, c) => s + (c.seconds || 0), 0);

    return {
      days,
      newLeads: newLeads.length,
      newLeadsDelta: delta(newLeads.length, newLeadsPrev.length),
      todo: todo.length,
      oldestTodoAgeDays: oldestTodo === null ? null : Math.floor((now - oldestTodo) / MS_DAY),
      qualified: qualified.length,
      qualifiedRate: pct(qualified.length, newLeads.length),
      qualifiedRatePrev: pct(qualifiedPrev.length, newLeadsPrev.length),
      openDeals: open.length,
      openAmount,
      weighted: Math.round(weighted),
      depositPending: depositPending.length,
      depositPendingAmount: depositPending.reduce((s, d) => s + (d.amount || 0), 0),
      won: won.length,
      wonDelta: delta(won.length, wonPrev.length),
      wonAmount: won.reduce((s, d) => s + (d.amount || 0), 0),
      winRate: pct(won.length, closedTotal),
      overdueTasks: overdueTasks.length,
      todayTasks: todayTasks.length,
      upcomingEvents: upcomingEvents.length,
      calls: callsPeriod.length,
      callsDelta: delta(callsPeriod.length, callsPrev.length),
      talkMinutes: Math.round(talkSeconds / 60),
    };
  }

  /** Prospects créés par semaine (semaines ISO commençant le lundi), les `weeks` dernières. */
  function leadsPerWeek(leads, weeks, now) {
    const thisWeek = startOfWeek(now);
    const buckets = [];
    for (let i = weeks - 1; i >= 0; i--) {
      const start = thisWeek - i * 7 * MS_DAY;
      buckets.push({ start, end: start + 7 * MS_DAY, count: 0, qualified: 0 });
    }
    for (const l of leads) {
      if (l.created === null) continue;
      const b = buckets.find((x) => l.created >= x.start && l.created < x.end);
      if (b) { b.count++; if (isQualifiedLead(l) || l.converted) b.qualified++; }
    }
    return buckets;
  }

  /** Entonnoir de qualification sur un ensemble de prospects. */
  function leadFunnel(leads) {
    const counts = countBy(leads, (l) => l.status);
    const rows = LEAD_STATUS_ORDER.map((s) => ({ status: s, count: counts.get(s) || 0 }));
    const dead = LEAD_STATUS_DEAD.map((s) => ({ status: s, count: counts.get(s) || 0 }));
    const known = new Set(LEAD_STATUS_ALL);
    const other = [...counts.entries()].filter(([s]) => !known.has(s)).reduce((n, [, c]) => n + c, 0);
    return { rows, dead, other };
  }

  /** Synthèse pipeline : par étape, nombre et montant, dans l'ordre canonique. */
  function pipelineSummary(deals, pipeline) {
    const sel = deals.filter((d) => !pipeline || pipeline === "all" || d.pipeline === pipeline);
    const map = new Map();
    for (const d of sel) {
      const e = map.get(d.stage) || { stage: d.stage, count: 0, amount: 0, deals: [] };
      e.count++; e.amount += d.amount || 0; e.deals.push(d);
      map.set(d.stage, e);
    }
    const order = (s) => { const i = DEAL_STAGES.indexOf(s); return i === -1 ? 999 : i; };
    return [...map.values()].sort((a, b) => order(a.stage) - order(b.stage) || a.stage.localeCompare(b.stage));
  }

  /** Colonnes du kanban : étapes principales + étapes non vides, dans l'ordre. */
  function kanbanColumns(deals) {
    const present = new Set(deals.map((d) => d.stage));
    const cols = DEAL_STAGES.filter((s) => DEAL_STAGES_MAIN.includes(s) || present.has(s));
    for (const s of present) if (!cols.includes(s)) cols.push(s);
    return cols;
  }

  function daysSince(t, now) { return t === null ? null : Math.floor((now - t) / MS_DAY); }

  /** Affaires ouvertes sans activité depuis plus de `days` jours. */
  function stalledDeals(deals, now, days) {
    return deals
      .filter((d) => isOpenDeal(d))
      .map((d) => ({ deal: d, idle: daysSince(d.lastActivity || d.modified, now) }))
      .filter((x) => x.idle !== null && x.idle > days)
      .sort((a, b) => b.idle - a.idle);
  }

  /** Prospects chauds : qualifiés, non convertis, triés par score puis fraîcheur. */
  function hotLeads(leads, limit) {
    return leads
      .filter((l) => !isDeadLead(l) && (isQualifiedLead(l) || l.score >= 25))
      .sort((a, b) => b.score - a.score || (b.modified || 0) - (a.modified || 0))
      .slice(0, limit || 8);
  }

  /** Agenda du jour : tâches en retard / du jour, appels planifiés, réunions. */
  function todayAgenda(data, now) {
    const d0 = startOfDay(now), d1 = endOfDay(now);
    const overdue = data.tasks.filter((t) => isOpenTask(t) && t.due !== null && t.due < d0)
      .sort((a, b) => a.due - b.due);
    const today = data.tasks.filter((t) => isOpenTask(t) && t.due !== null && t.due >= d0 && t.due <= d1);
    const calls = data.calls.filter((c) => c.status === "Scheduled" && c.start !== null && c.start >= d0 && c.start <= d1)
      .sort((a, b) => a.start - b.start);
    const events = data.events.filter((e) => e.start !== null && e.start >= d0 && e.start <= d1)
      .sort((a, b) => a.start - b.start);
    return { overdue, today, calls, events };
  }

  /** Grille de planning : 7 jours à partir du lundi de la semaine de `anchor`. */
  function weekGrid(data, anchor) {
    const start = startOfWeek(anchor);
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d0 = start + i * MS_DAY, d1 = d0 + MS_DAY - 1;
      const items = [];
      for (const e of data.events) if (e.start !== null && e.start >= d0 && e.start <= d1) items.push({ kind: "event", at: e.start, item: e });
      for (const c of data.calls) if (c.start !== null && c.start >= d0 && c.start <= d1 && (c.status === "Scheduled" || c.start >= Date.now())) items.push({ kind: "call", at: c.start, item: c });
      for (const t of data.tasks) if (t.due !== null && t.due >= d0 && t.due <= d1 && isOpenTask(t)) items.push({ kind: "task", at: t.due, item: t });
      items.sort((a, b) => a.at - b.at);
      days.push({ start: d0, items });
    }
    return { start, days };
  }

  /** Statistiques d'appels sur une période. */
  function callStats(calls, now, days) {
    const from = now - days * MS_DAY;
    const sel = calls.filter((c) => c.status !== "Scheduled" && c.start !== null && c.start >= from && c.start <= now);
    const byType = countBy(sel, (c) => c.type);
    const byResult = countBy(sel.filter((c) => c.result), (c) => c.result);
    const byOwnerMap = new Map();
    for (const c of sel) {
      const k = c.owner ? c.owner.name : "—";
      const e = byOwnerMap.get(k) || { owner: k, count: 0, seconds: 0, answered: 0 };
      e.count++; e.seconds += c.seconds || 0; if (c.seconds >= 60) e.answered++;
      byOwnerMap.set(k, e);
    }
    const answered = sel.filter((c) => c.seconds >= 60).length;
    const scheduled = calls.filter((c) => c.status === "Scheduled" && c.start !== null && c.start >= now);
    const overdueScheduled = calls.filter((c) => c.status === "Scheduled" && c.start !== null && c.start < now);
    return {
      total: sel.length,
      answered,
      answerRate: pct(answered, sel.length),
      minutes: Math.round(sel.reduce((s, c) => s + (c.seconds || 0), 0) / 60),
      byType: sortedCounts(byType),
      byResult: sortedCounts(byResult),
      byOwner: [...byOwnerMap.values()].sort((a, b) => b.count - a.count),
      scheduled: scheduled.sort((a, b) => a.start - b.start),
      overdueScheduled,
    };
  }

  /** Répartition des prospects par source (top N + « Autres »). */
  function sourceBreakdown(leads, limit) {
    const counts = sortedCounts(countBy(leads, (l) => l.source));
    const top = counts.slice(0, limit);
    const rest = counts.slice(limit).reduce((n, [, c]) => n + c, 0);
    if (rest > 0) top.push(["Autres", rest]);
    return top.map(([source, count]) => ({ source, count }));
  }

  /** Propriétaires distincts présents dans les données. */
  function owners(data) {
    const m = new Map();
    for (const k of ["leads", "deals", "tasks", "calls", "events"]) {
      for (const r of data[k] || []) if (r.owner && r.owner.id) m.set(r.owner.id, r.owner.name);
    }
    return [...m.entries()].map(([id, name]) => ({ id, name })).sort((a, b) => a.name.localeCompare(b.name));
  }

  /* ------------------------------------------------------------------ */
  /* 4. Filtrage et recherche                                            */
  /* ------------------------------------------------------------------ */

  function fold(s) {
    return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  }

  function filterLeads(leads, f) {
    const q = fold(f.q || "").trim();
    return leads.filter((l) => {
      if (f.status && f.status !== "all") {
        if (f.status === "todo" && !isTodoLead(l)) return false;
        if (f.status === "hot" && !(isQualifiedLead(l) || l.score >= 25)) return false;
        if (f.status === "dead" && !isDeadLead(l)) return false;
        if (!["todo", "hot", "dead"].includes(f.status) && l.status !== f.status) return false;
      }
      if (f.source && f.source !== "all" && l.source !== f.source) return false;
      if (f.owner && f.owner !== "all" && !(l.owner && l.owner.id === f.owner)) return false;
      if (q) {
        const hay = fold([l.name, l.email, l.phone, l.city, l.source, l.status].join(" "));
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function sortLeads(leads, key, dir) {
    const m = dir === "asc" ? 1 : -1;
    const get = {
      name: (l) => fold(l.name), created: (l) => l.created || 0, modified: (l) => l.modified || 0,
      score: (l) => l.score || 0, status: (l) => { const i = LEAD_STATUS_ALL.indexOf(l.status); return i === -1 ? 99 : i; },
      source: (l) => fold(l.source),
    }[key] || ((l) => l.modified || 0);
    return leads.slice().sort((a, b) => { const x = get(a), y = get(b); return x < y ? -m : x > y ? m : 0; });
  }

  /* ------------------------------------------------------------------ */
  /* 5. Écriture Zoho (outils d'écriture optionnels du connecteur)       */
  /* ------------------------------------------------------------------ */

  const READ_TOOLS = ["ZohoCRM_getRecords", "ZohoCRM_getRecord", "ZohoCRM_searchRecords", "ZohoCRM_getNoteById"];
  /** Noms d'outils d'écriture reconnus, par ordre de préférence. */
  const WRITE_TOOL_CANDIDATES = {
    update: ["ZohoCRM_updateRecord", "ZohoCRM_updateRecords", "ZohoCRM_upsertRecords"],
    create: ["ZohoCRM_createRecords", "ZohoCRM_insertRecords", "ZohoCRM_createRecord"],
    convert: ["ZohoCRM_convertLead", "ZohoCRM_convertLeads"],
    note: ["ZohoCRM_createNotes", "ZohoCRM_createNote"],
  };
  const ALL_WRITE_TOOLS = Object.values(WRITE_TOOL_CANDIDATES).flat();

  /** Choisit, parmi les outils réellement exposés, ceux à utiliser pour chaque action. */
  function pickWriteTools(toolNames) {
    const set = new Set(toolNames || []);
    const out = {};
    for (const [action, cands] of Object.entries(WRITE_TOOL_CANDIDATES)) {
      out[action] = cands.find((n) => set.has(n)) || null;
    }
    out.any = Boolean(out.update || out.create || out.note || out.convert);
    return out;
  }

  /**
   * Construit les arguments d'un outil d'écriture à partir de son schéma JSON
   * (`describeTool`), ou d'une forme par défaut si le schéma est inconnu.
   *
   * @param schema  inputSchema de l'outil (peut être null)
   * @param op      {module, id?, record}
   */
  function buildWriteArgs(schema, op) {
    const props = (schema && schema.properties) || null;
    const record = Object.assign({}, op.record);
    const args = {};
    if (!props) {
      // Forme Zoho MCP par défaut : path_variables + body {data:[...]}
      const pv = { module: op.module };
      if (op.id) pv.recordId = op.id;
      args.path_variables = pv;
      args.body = { data: [record] };
      return args;
    }
    // Variables de chemin
    const pvKey = ["path_variables", "pathVariables", "path"].find((k) => props[k]);
    if (pvKey) {
      const pv = {};
      const sub = (props[pvKey].properties) || {};
      for (const k of Object.keys(sub)) {
        if (/module/i.test(k)) pv[k] = op.module;
        else if (op.id && /(record|^id$|_id$|Id$)/i.test(k)) pv[k] = op.id;
      }
      if (!Object.keys(pv).length) pv.module = op.module;
      args[pvKey] = pv;
    } else if (props.module) {
      args.module = op.module;
      if (op.id) { const idKey = ["recordId", "record_id", "id"].find((k) => props[k]); if (idKey) args[idKey] = op.id; }
    }
    // Si l'identifiant ne passe pas par le chemin, il voyage dans l'enregistrement
    const idInPath = pvKey && Object.keys((props[pvKey].properties) || {}).some((k) => op.id && /(record|^id$|_id$|Id$)/i.test(k));
    if (op.id && !idInPath && !args.recordId && !args.record_id && !args.id) record.id = op.id;
    // Corps
    const bodyKey = ["body", "request_body", "requestBody", "payload", "data", "input", "record", "records"].find((k) => props[k]);
    if (!bodyKey) { args.body = { data: [record] }; return args; }
    const bs = props[bodyKey] || {};
    if (bodyKey === "data" || bodyKey === "records") args[bodyKey] = bs.type === "array" ? [record] : (bs.properties && bs.properties.data ? { data: [record] } : record);
    else if (bodyKey === "record") args.record = record;
    else if (bs.properties && bs.properties.data) args[bodyKey] = { data: [record] };
    else if (bs.type === "array") args[bodyKey] = [record];
    else args[bodyKey] = { data: [record] };
    return args;
  }

  /** Enregistrement Zoho pour une tâche liée à un prospect ou une affaire. */
  function taskRecord(o) {
    const r = { Subject: o.subject, Status: o.status || "Not Started", Priority: o.priority || "Normal" };
    if (o.due) r.Due_Date = o.due;
    if (o.description) r.Description = o.description;
    if (o.parentModule === "Leads") { r.What_Id = o.parentId; r.$se_module = "Leads"; }
    else if (o.parentModule === "Deals") { r.What_Id = o.parentId; r.$se_module = "Deals"; if (o.contactId) r.Who_Id = o.contactId; }
    else if (o.parentModule === "Contacts") { r.Who_Id = o.parentId; }
    return r;
  }

  /** Enregistrement Zoho pour un appel planifié. */
  function callRecord(o) {
    const r = {
      Subject: o.subject, Call_Type: "Outbound", Outgoing_Call_Status: "Scheduled",
      Call_Start_Time: o.startIso, Call_Purpose: o.purpose || "Prospecting",
    };
    if (o.description) r.Description = o.description;
    if (o.parentModule === "Leads") { r.What_Id = o.parentId; r.$se_module = "Leads"; }
    else if (o.parentModule === "Deals") { r.What_Id = o.parentId; r.$se_module = "Deals"; if (o.contactId) r.Who_Id = o.contactId; }
    else if (o.parentModule === "Contacts") { r.Who_Id = o.parentId; }
    return r;
  }

  /** Enregistrement Zoho pour une réunion. */
  function eventRecord(o) {
    const r = { Event_Title: o.title, Start_DateTime: o.startIso, End_DateTime: o.endIso };
    if (o.venueType) r.Meeting_Venue__s = o.venueType;
    if (o.venue) r.Venue = o.venue;
    if (o.description) r.Description = o.description;
    if (o.parentModule === "Leads") { r.What_Id = o.parentId; r.$se_module = "Leads"; }
    else if (o.parentModule === "Deals") { r.What_Id = o.parentId; r.$se_module = "Deals"; if (o.contactId) r.Who_Id = o.contactId; }
    return r;
  }

  /** Enregistrement Zoho pour une note. */
  function noteRecord(o) {
    return { Note_Title: o.title || "Note", Note_Content: o.content, Parent_Id: o.parentId, se_module: o.parentModule };
  }

  /** Date ISO avec décalage local, au format attendu par Zoho (yyyy-MM-ddTHH:mm:ss+HH:mm). */
  function zohoDateTime(t) {
    const d = new Date(t);
    const p = (n) => String(n).padStart(2, "0");
    const off = -d.getTimezoneOffset();
    const sign = off >= 0 ? "+" : "-";
    const a = Math.abs(off);
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}${sign}${p(Math.floor(a / 60))}:${p(a % 60)}`;
  }
  function zohoDate(t) {
    const d = new Date(t);
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }

  /**
   * Instruction en français à coller dans Claude (mode lecture seule ou
   * action non couverte par le connecteur).
   */
  function claudeInstruction(action, o) {
    const who = o.name ? `« ${o.name} »` : "";
    const idPart = `(${o.module === "Deals" ? "affaire" : o.module === "Leads" ? "prospect" : "enregistrement"} Zoho CRM id ${o.id})`;
    switch (action) {
      case "status": return `Dans Zoho CRM, passe le prospect ${who} ${idPart} au statut « ${o.value} ».`;
      case "step": return `Dans Zoho CRM, mets l'étape du prospect ${who} ${idPart} à « ${o.value} ».`;
      case "stage": return `Dans Zoho CRM, passe l'affaire ${who} ${idPart} à l'étape « ${o.value} »${o.extra ? ` (${o.extra})` : ""}.`;
      case "note": return `Dans Zoho CRM, ajoute cette note sur ${who} ${idPart} :\n${o.value}`;
      case "task": return `Dans Zoho CRM, crée une tâche « ${o.value} » liée à ${who} ${idPart}${o.due ? `, échéance ${o.due}` : ""}${o.priority ? `, priorité ${o.priority}` : ""}.`;
      case "call": return `Dans Zoho CRM, planifie un appel sortant « ${o.value} » avec ${who} ${idPart} le ${o.when}.`;
      case "event": return `Dans Zoho CRM, crée une réunion « ${o.value} » avec ${who} ${idPart} le ${o.when}${o.extra ? ` (${o.extra})` : ""}.`;
      case "convert": return `Dans Zoho CRM, convertis le prospect ${who} ${idPart} en contact et crée l'affaire de recrutement associée (pipeline Recrutement, étape « Évaluation initiale »${o.extra ? `, promotion ${o.extra}` : ""}).`;
      case "taskDone": return `Dans Zoho CRM, marque la tâche ${who} ${idPart} comme terminée.`;
      case "callResult": return `Dans Zoho CRM, enregistre le résultat « ${o.value} » pour l'appel ${who} ${idPart}.`;
      case "eventResult": return `Dans Zoho CRM, enregistre le résultat « ${o.value} » pour la réunion ${who} ${idPart}.`;
      default: return `Dans Zoho CRM, sur ${who} ${idPart} : ${o.value || action}.`;
    }
  }

  /* ------------------------------------------------------------------ */
  /* 6. Formatage                                                         */
  /* ------------------------------------------------------------------ */

  const fmt = {
    money(n) {
      if (n === null || n === undefined) return "—";
      return new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(n);
    },
    moneyShort(n) {
      if (n === null || n === undefined) return "—";
      if (Math.abs(n) >= 1000) return `${(n / 1000).toLocaleString("fr-FR", { maximumFractionDigits: 1 })} k€`;
      return `${Math.round(n)} €`;
    },
    int(n) { return (n ?? 0).toLocaleString("fr-FR"); },
    date(t) { return t ? new Date(t).toLocaleDateString("fr-FR", { day: "2-digit", month: "short" }) : "—"; },
    dateFull(t) { return t ? new Date(t).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" }) : "—"; },
    dateTime(t) { return t ? new Date(t).toLocaleString("fr-FR", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "—"; },
    time(t) { return t ? new Date(t).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : "—"; },
    weekday(t) { return new Date(t).toLocaleDateString("fr-FR", { weekday: "short", day: "numeric" }); },
    relative(t, now) {
      if (!t) return "—";
      const d = Math.round((now - t) / MS_DAY);
      if (d <= 0) { const h = Math.round((now - t) / 3600000); return h <= 0 ? "à l'instant" : h < 24 ? `il y a ${h} h` : "aujourd'hui"; }
      if (d === 1) return "hier";
      if (d < 30) return `il y a ${d} j`;
      if (d < 365) return `il y a ${Math.round(d / 30)} mois`;
      return `il y a ${Math.round(d / 365)} an${d >= 730 ? "s" : ""}`;
    },
    duration(sec) {
      if (!sec) return "—";
      const m = Math.floor(sec / 60), s = sec % 60;
      return m ? `${m} min ${String(s).padStart(2, "0")}` : `${s} s`;
    },
    delta(d) { return d === null ? "nouveau" : `${d > 0 ? "+" : ""}${d} %`; },
    initials(name) { return String(name || "?").split(/\s+/).map((x) => x[0]).filter(Boolean).slice(0, 2).join("").toUpperCase(); },
  };

  /* ------------------------------------------------------------------ */
  /* 7. Jeu de démonstration (fictif, déterministe)                      */
  /* ------------------------------------------------------------------ */

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

<script>
/*
 * Dashboard ESO — interface (DOM) et connexion Zoho CRM.
 * Dépend de `ESO` (core.js), inliné avant ce script dans la page publiée.
 */
(function () {
  "use strict";
  const E = window.ESO;
  const { fmt, MS_DAY } = E;

  /* ------------------------------------------------------------------ */
  /* État                                                                 */
  /* ------------------------------------------------------------------ */
  const state = {
    view: "cockpit",
    days: 30,
    owner: "all",
    pipeline: "Recrutement",
    promo: "all",
    leadFilter: { q: "", status: "all", source: "all", sort: "modified", dir: "desc" },
    callDays: 30,
    weekAnchor: Date.now(),
    data: { leads: [], deals: [], tasks: [], calls: [], events: [] },
    loaded: false,
    loading: false,
    demo: false,
    mcp: null,          // namespace de la capacité
    sample: null,       // capacité « demander à Claude »
    connected: false,   // le connecteur Zoho CRM répond
    write: { update: null, create: null, convert: null, note: null, any: false },
    schemas: {},        // inputSchema par outil d'écriture
    errors: {},         // erreurs par module
    pageError: null,    // erreur globale {code, message}
    updatedAt: null,
    drawer: null,       // {module, id}
    toolNames: [],
  };

  const $ = (sel, root) => (root || document).querySelector(sel);
  const h = (tag, attrs, ...children) => {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "html") el.innerHTML = v;
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
      else if (k === "dataset") Object.assign(el.dataset, v);
      else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const c of children.flat(Infinity)) {
      if (c === null || c === undefined || c === false) continue;
      el.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return el;
  };
  const svgEl = (tag, attrs, ...children) => {
    const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
    for (const c of children.flat(Infinity)) if (c !== null && c !== undefined) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
    return el;
  };

  const ICONS = {
    cockpit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 13a9 9 0 1 1 18 0"/><path d="M12 13l4-4"/><path d="M5 20h14"/></svg>',
    leads: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M17 8h4M19 6v4"/></svg>',
    pipeline: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="6" rx="1"/></svg>',
    calls: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
    planning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17l.8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8z"/></svg>',
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>',
    arrowL: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>',
    arrowR: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12l5 5L20 7"/></svg>',
  };
  const icon = (name) => { const s = h("span", { class: "ico", html: ICONS[name] }); s.style.display = "contents"; return s; };

  const VIEWS = [
    { id: "cockpit", label: "Cockpit" },
    { id: "leads", label: "Prospects" },
    { id: "pipeline", label: "Pipeline" },
    { id: "calls", label: "Appels" },
    { id: "planning", label: "Planning" },
  ];

  /* ------------------------------------------------------------------ */
  /* Préférences locales (confort par utilisateur)                       */
  /* ------------------------------------------------------------------ */
  function loadPrefs() {
    try {
      const p = JSON.parse(localStorage.getItem("eso-dashboard-prefs") || "{}");
      if (VIEWS.some((v) => v.id === p.view)) state.view = p.view;
      if ([7, 30, 90].includes(p.days)) state.days = p.days;
      if (typeof p.owner === "string") state.owner = p.owner;
      if (typeof p.pipeline === "string") state.pipeline = p.pipeline;
    } catch (e) { /* stockage indisponible : on garde les valeurs par défaut */ }
    const hash = (location.hash || "").slice(1);
    if (VIEWS.some((v) => v.id === hash)) state.view = hash;
  }
  function savePrefs() {
    try { localStorage.setItem("eso-dashboard-prefs", JSON.stringify({ view: state.view, days: state.days, owner: state.owner, pipeline: state.pipeline })); } catch (e) { /* ignoré */ }
  }

  /* ------------------------------------------------------------------ */
  /* Toasts                                                               */
  /* ------------------------------------------------------------------ */
  function toast(msg, kind) {
    const box = $("#toasts");
    const t = h("div", { class: `toast ${kind || ""}`, role: "status" }, msg);
    box.append(t);
    setTimeout(() => t.remove(), kind === "crit" ? 7000 : 3500);
  }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); toast("Copié dans le presse-papiers", "good"); return true; }
    catch (e) {
      const ta = h("textarea", { class: "input", readonly: true }, text);
      document.body.append(ta); ta.select();
      toast("Sélectionnez le texte et copiez-le (Ctrl/Cmd+C)");
      setTimeout(() => ta.remove(), 8000);
      return false;
    }
  }

  /* ------------------------------------------------------------------ */
  /* Connexion Zoho CRM                                                   */
  /* ------------------------------------------------------------------ */
  const ERROR_COPY = {
    needs_reauth: { title: "Reconnectez Zoho CRM", text: "La connexion à Zoho CRM a expiré. Reconnectez le connecteur « Zoho CRM » dans claude.ai → Paramètres → Connecteurs, puis actualisez." },
    server_not_connected: { title: "Connecteur Zoho CRM absent", text: "Ajoutez le connecteur « Zoho CRM » dans claude.ai → Paramètres → Connecteurs pour afficher les données réelles." },
    selection_required: { title: "Choisissez un connecteur", text: "Plusieurs connecteurs s'appellent « Zoho CRM ». Choisissez celui à utiliser dans l'invite de Claude, puis actualisez." },
    not_in_manifest: { title: "Accès refusé pour cette page", text: "Le connecteur Zoho CRM a été refusé pour ce tableau de bord. Autorisez-le dans le menu Permissions de l'artefact." },
    blocked_by_policy: { title: "Bloqué par la politique de l'organisation", text: "Un administrateur a bloqué cet outil Zoho CRM pour votre compte." },
    approval_required: { title: "Autorisation requise", text: "Claude attend votre accord pour interroger Zoho CRM. Cliquez sur « Autoriser et réessayer »." },
    server_unavailable: { title: "Zoho CRM indisponible", text: "Zoho CRM ne répond pas pour le moment. Nouvelle tentative dans quelques secondes." },
    tool_error: { title: "Zoho CRM a renvoyé une erreur", text: "" },
    not_granted: { title: "Connecteurs non accordés", text: "Cette vue n'a pas accès aux connecteurs. Ouvrez le tableau de bord depuis Claude pour afficher les données réelles." },
    capability_disabled: { title: "Connecteurs indisponibles dans cette vue", text: "Ouvrez le tableau de bord dans l'application Claude pour afficher les données réelles." },
  };
  function errorCopy(err) {
    const code = (err && err.code) || "upstream_error";
    const c = ERROR_COPY[code] || { title: "Erreur de connexion", text: "" };
    const detail = err && err.message ? String(err.message).slice(0, 300) : "";
    return { code, title: c.title, text: c.text || detail, detail };
  }

  async function callZoho(tool, input, opts) {
    const res = await state.mcp.callTool(E.SERVER, tool, input, opts);
    return res && res.payload !== undefined ? res.payload : res;
  }

  /** Charge toutes les pages d'un module (budget de pages borné). */
  async function fetchModule(module, refresh) {
    const out = [];
    const budget = E.PAGE_BUDGET[module];
    const norm = E.NORMALIZERS[module];
    for (let page = 1; page <= budget; page++) {
      let payload;
      try {
        payload = await callZoho("ZohoCRM_getRecords", E.recordsArgs(module, page), { cache: { staleTime: 60000, refresh: Boolean(refresh) } });
      } catch (err) {
        if (err && err.retryable && page === 1 && !refresh) {
          await new Promise((r) => setTimeout(r, Math.min(err.retryAfterMs || 1500, 8000) + Math.random() * 500));
          payload = await callZoho("ZohoCRM_getRecords", E.recordsArgs(module, page), { cache: { staleTime: 60000 } });
        } else throw err;
      }
      const { records, more } = E.unwrapRecords(payload);
      for (const r of records) out.push(norm(r));
      if (!more || records.length === 0) break;
    }
    return out;
  }

  async function loadAll(refresh) {
    if (!state.mcp || state.demo) return;
    state.loading = true; state.pageError = null; render();
    const modules = ["Leads", "Deals", "Tasks", "Calls", "Events"];
    const results = await Promise.allSettled(modules.map((m) => fetchModule(m, refresh)));
    const errors = {};
    let okCount = 0;
    results.forEach((r, i) => {
      const key = modules[i].toLowerCase();
      if (r.status === "fulfilled") { state.data[key] = r.value; okCount++; }
      else errors[modules[i]] = r.reason || { code: "upstream_error", message: "inconnue" };
    });
    state.errors = errors;
    const codes = new Set(Object.values(errors).map((e) => e.code));
    if (okCount === 0 && codes.size === 1) state.pageError = Object.values(errors)[0];
    if (okCount > 0) { state.loaded = true; state.updatedAt = Date.now(); state.connected = true; }
    state.loading = false;
    render();
  }

  /** Découvre les outils (lecture / écriture) réellement exposés par le connecteur. */
  async function discoverTools() {
    try {
      const lt = await state.mcp.listTools(E.SERVER);
      const srv = (lt.servers || []).find((s) => s.server === E.SERVER);
      state.toolNames = srv ? srv.tools.map((t) => t.name) : [];
      state.serverListed = Boolean(srv);
      state.authStatus = srv ? srv.authStatus : "absent";
    } catch (e) { state.toolNames = []; state.serverListed = false; }
    state.write = E.pickWriteTools(state.toolNames);
  }
  async function ensureSchema(tool) {
    if (!tool || tool in state.schemas) return state.schemas[tool] || null;
    try { const d = await state.mcp.describeTool(E.SERVER, tool); state.schemas[tool] = (d && d.inputSchema) || null; }
    catch (e) { state.schemas[tool] = null; }
    return state.schemas[tool];
  }

  /** Exécute une écriture : {kind: update|create|note, module, id?, record}. */
  async function writeZoho(kind, op) {
    const tool = state.write[kind] || (kind === "note" ? state.write.create : null);
    if (!tool) throw { code: "read_only", message: "Aucun outil d'écriture disponible" };
    const schema = await ensureSchema(tool);
    const module = kind === "note" && !state.write.note ? "Notes" : op.module;
    const args = E.buildWriteArgs(schema, { module, id: op.id, record: op.record });
    const payload = await callZoho(tool, args, { cache: false });
    // Zoho répond {data:[{code:"SUCCESS"|..., details:{id}}]}
    const inner = payload && payload.data && !Array.isArray(payload.data) ? payload.data : payload;
    const rows = inner && Array.isArray(inner.data) ? inner.data : [];
    const bad = rows.find((r) => r.code && r.code !== "SUCCESS");
    if (bad) throw { code: "tool_error", message: `${bad.code} : ${bad.message || JSON.stringify(bad.details || {})}` };
    const id = rows[0] && rows[0].details && rows[0].details.id;
    try { await state.mcp.invalidate(E.SERVER, "ZohoCRM_getRecords"); } catch (e) { /* rien en cache */ }
    return { id: id || op.id };
  }

  async function boot() {
    loadPrefs();
    render();
    if (!window.claude || typeof window.claude.use !== "function") { enterDemo("Ouvert hors de Claude"); return; }
    const [mcp, sample] = await Promise.all([window.claude.use("mcp"), window.claude.use("sample")]);
    state.sample = sample;
    if (!mcp) { enterDemo("Connecteurs indisponibles dans cette vue"); return; }
    state.mcp = mcp;
    await discoverTools();
    if (state.serverListed === false) { state.pageError = { code: "server_not_connected" }; state.loaded = false; render(); return; }
    await loadAll(false);
    // Rafraîchissement périodique (page visible uniquement)
    setInterval(() => { if (document.visibilityState === "visible" && !state.demo && !state.loading) loadAll(true); }, 5 * 60 * 1000);
  }

  function enterDemo(reason) {
    state.demo = true; state.demoReason = reason;
    state.data = E.demoData(Date.now());
    state.loaded = true; state.updatedAt = Date.now();
    state.write = { update: "demo", create: "demo", convert: "demo", note: "demo", any: true };
    render();
  }
  function exitDemo() {
    state.demo = false; state.data = { leads: [], deals: [], tasks: [], calls: [], events: [] }; state.loaded = false;
    state.write = E.pickWriteTools(state.toolNames);
    if (state.mcp) loadAll(true); else render();
  }

  /* ------------------------------------------------------------------ */
  /* Rendu principal                                                      */
  /* ------------------------------------------------------------------ */
  function render() {
    renderNav();
    const main = $("#main");
    main.replaceChildren();
    main.append(renderTopbar());
    const banner = renderBanner();
    if (banner) main.append(banner);
    if (!state.loaded) { main.append(renderSkeleton()); return; }
    const fn = { cockpit: renderCockpit, leads: renderLeads, pipeline: renderPipeline, calls: renderCalls, planning: renderPlanning }[state.view];
    main.append(fn());
    renderDrawer();
  }

  function renderNav() {
    const nav = $("#nav");
    nav.replaceChildren();
    nav.append(h("div", { class: "brand" },
      h("div", { class: "brand-mark" }, "ESO"),
      h("div", null, h("div", { class: "brand-title" }, "Dashboard ESO"), h("div", { class: "brand-sub" }, "Recrutement des étudiants"))));
    const counts = navCounts();
    for (const v of VIEWS) {
      nav.append(h("button", {
        class: "nav-btn", "aria-current": state.view === v.id ? "page" : null,
        onclick: () => { state.view = v.id; state.drawer = null; savePrefs(); try { history.replaceState(null, "", "#" + v.id); } catch (e) { /* ignoré */ } render(); },
      }, icon(v.id), v.label, counts[v.id] ? h("span", { class: `badge ${counts[v.id].kind}` }, counts[v.id].n) : null));
    }
    const foot = h("div", { class: "nav-foot" });
    foot.append(h("span", null, state.demo ? "Données de démonstration" : state.connected ? "Connecté à Zoho CRM" : "Non connecté"));
    if (state.updatedAt) foot.append(h("span", null, `Actualisé ${fmt.time(state.updatedAt)}`));
    foot.append(h("span", null, state.write.any ? (state.demo ? "Écriture simulée" : "Écriture activée") : "Lecture seule"));
    nav.append(foot);
  }
  function navCounts() {
    if (!state.loaded) return {};
    const now = Date.now();
    const d = filteredData();
    const todo = d.leads.filter(E.isTodoLead).length;
    const ag = E.todayAgenda(d, now);
    const overdueCalls = d.calls.filter((c) => c.status === "Scheduled" && c.start !== null && c.start < now).length;
    return {
      leads: todo ? { n: todo, kind: "accent" } : null,
      planning: ag.overdue.length ? { n: ag.overdue.length, kind: "crit" } : null,
      calls: overdueCalls ? { n: overdueCalls, kind: "warn" } : null,
    };
  }

  function filteredData() {
    const o = state.owner;
    return {
      leads: E.byOwner(state.data.leads, o), deals: E.byOwner(state.data.deals, o),
      tasks: E.byOwner(state.data.tasks, o), calls: E.byOwner(state.data.calls, o), events: E.byOwner(state.data.events, o),
    };
  }

  function renderTopbar() {
    const title = { cockpit: "Cockpit", leads: "Prospects", pipeline: "Pipeline de recrutement", calls: "Appels", planning: "Planning" }[state.view];
    const bar = h("div", { class: "topbar" });
    bar.append(h("div", null, h("h1", null, title), h("div", { class: "sub" }, fmt.dateFull(Date.now()))));
    const ownersList = E.owners(state.data);
    const ownerSel = h("select", { class: "select", id: "owner-select", "aria-label": "Responsable", onchange: (e) => { state.owner = e.target.value; savePrefs(); render(); } },
      h("option", { value: "all" }, "Toute l'équipe"),
      ownersList.map((o) => h("option", { value: o.id, selected: state.owner === o.id ? true : null }, o.name)));
    const period = h("div", { class: "seg", role: "group", "aria-label": "Période" },
      [7, 30, 90].map((d) => h("button", { "aria-pressed": state.days === d ? "true" : "false", onclick: () => { state.days = d; savePrefs(); render(); } }, `${d} j`)));
    const refresh = h("button", { class: "btn", id: "refresh-btn", disabled: state.loading || state.demo ? true : null, onclick: () => loadAll(true) },
      h("span", { class: state.loading ? "spin" : "", style: { display: "inline-flex" }, html: ICONS.refresh }), state.loading ? "Chargement…" : "Actualiser");
    bar.append(h("div", { class: "toolbar" }, ownerSel, period, refresh));
    return bar;
  }

  function renderBanner() {
    if (state.demo) {
      return h("div", { class: "banner warn" }, h("div", { class: "grow" },
        h("strong", null, "Données de démonstration (fictives)"),
        h("span", null, `${state.demoReason || ""}. Ouvrez ce tableau de bord depuis Claude avec le connecteur Zoho CRM pour voir les prospects réels.`)),
        state.mcp ? h("button", { class: "btn sm", onclick: exitDemo }, "Revenir aux données Zoho") : null);
    }
    if (state.pageError) {
      const c = errorCopy(state.pageError);
      const b = h("div", { class: `banner ${c.code === "approval_required" ? "warn" : "crit"}` }, h("div", { class: "grow" }, h("strong", null, c.title), h("span", null, c.text || c.detail)));
      const actions = h("div", { class: "actions" });
      actions.append(h("button", { class: "btn sm", onclick: () => loadAll(true) }, c.code === "approval_required" ? "Autoriser et réessayer" : "Réessayer"));
      actions.append(h("button", { class: "btn sm ghost", onclick: () => enterDemo("Mode démonstration choisi") }, "Voir la démonstration"));
      b.append(actions);
      return b;
    }
    const errs = Object.entries(state.errors);
    if (errs.length) {
      const names = { Leads: "prospects", Deals: "affaires", Tasks: "tâches", Calls: "appels", Events: "réunions" };
      return h("div", { class: "banner warn" }, h("div", { class: "grow" },
        h("strong", null, "Certaines données n'ont pas pu être chargées"),
        h("span", null, errs.map(([m, e]) => `${names[m]} : ${errorCopy(e).title}`).join(" · "))),
        h("button", { class: "btn sm", onclick: () => loadAll(true) }, "Réessayer"));
    }
    if (state.loaded && !state.write.any) {
      return h("div", { class: "banner" }, h("div", { class: "grow" },
        h("strong", null, "Lecture seule"),
        h("span", null, "Le connecteur Zoho CRM n'expose que des outils de lecture. Chaque action propose une instruction à coller dans Claude, qui effectuera la modification. Pour une écriture directe, ajoutez les outils de création et de mise à jour d'enregistrements au serveur MCP « Zoho CRM » (voir la documentation).")));
    }
    return null;
  }

  function renderSkeleton() {

  /** Graphique en barres hebdomadaire (SVG à l'échelle). */
  function weekBars(buckets) {
    const W = 600, H = 170, padL = 34, padB = 26, padT = 12, padR = 8;
    const max = Math.max(1, ...buckets.map((b) => b.count));
    const step = niceStep(max);
    const top = Math.ceil(max / step) * step;
    const svg = svgEl("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Prospects créés par semaine" });
    const innerW = W - padL - padR, innerH = H - padT - padB;
    const y = (v) => padT + innerH - (v / top) * innerH;
    for (let v = 0; v <= top; v += step) {
      svg.append(svgEl("line", { class: "axis", x1: padL, x2: W - padR, y1: y(v), y2: y(v), "stroke-width": 1 }));
      svg.append(svgEl("text", { x: padL - 6, y: y(v) + 3, "text-anchor": "end" }, v));
    }
    const bw = innerW / buckets.length;
    buckets.forEach((b, i) => {
      const x = padL + i * bw + bw * 0.15;
      const w = bw * 0.7;
      svg.append(svgEl("rect", { class: "bar soft", x, y: y(b.count), width: w, height: Math.max(0, innerH + padT - y(b.count)), rx: 3 }));
      svg.append(svgEl("rect", { class: "bar", x, y: y(b.qualified), width: w, height: Math.max(0, innerH + padT - y(b.qualified)), rx: 3 }));
      const last = i === buckets.length - 1;
      if (b.count) svg.append(svgEl("text", { x: x + w / 2, y: y(b.count) - 4, "text-anchor": "middle", class: last ? "label-strong" : "" }, b.count));
      if (i % 2 === buckets.length % 2 || buckets.length <= 8) svg.append(svgEl("text", { x: x + w / 2, y: H - 8, "text-anchor": "middle" }, fmt.date(b.start)));
    });
    return svg;
  }
  function niceStep(max) {
    const raw = max / 4;
    const p = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1))));
    for (const m of [1, 2, 5, 10]) if (raw <= m * p) return m * p;
    return 10 * p;
  }
